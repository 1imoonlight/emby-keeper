name: Docker Image Publish (fork)

# 该工作流为 fork 仓库 1imoonlight/emby-keeper 定制:
# - 推送到 stable 分支时构建多架构镜像并推送到 Docker Hub 的 lipengchengdocker/emby-keeper
# - 推送完成后通过 deploy hook 触发 Render 部署 (避免 Render 抢跑拿到旧 base image)
#
# 必需的仓库 Secrets:
#   DOCKERHUB_USERNAME      Docker Hub 用户名 (lipengchengdocker)
#   DOCKERHUB_TOKEN         Docker Hub access token (settings → security → new access token)
#
# 可选 Secrets:
#   RENDER_DEPLOY_HOOK_URL  Render service settings 中的 deploy hook URL; 未配置时跳过触发

on:
  workflow_dispatch:
  push:
    branches:
      - stable
    paths-ignore:
      - "*.md"
      - "docs/**"

env:
  REGISTRY_IMAGE: lipengchengdocker/emby-keeper

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # 仅在 fork 仓库运行, 避免被 PR 同步回上游时误触发
    if: github.repository == '1imoonlight/emby-keeper'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=stable
            type=raw,value=latest
            type=sha,format=long

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Pushed image digest:${{ steps.build.outputs.digest }}"

  trigger-render:
    needs: build-and-push
    if: success() && github.repository == '1imoonlight/emby-keeper'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL 未配置, 跳过 Render 触发. (在 Render service settings 找到 deploy hook 并加到仓库 Secrets)"
            exit 0
          fi
          set -e
          RESPONSE=$(curl -fSs -X POST "$HOOK_URL" -w "\n%{http_code}")
          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1)
          echo "Render response (HTTP $STATUS): $BODY"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "::error::Render deploy hook 返回非 2xx: $STATUS"
            exit 1
          fi
          echo "::notice::Render 部署已触发"
